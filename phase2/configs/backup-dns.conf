# ZeroNetwork private DNS (MAC-3 - BACKUP)
# Location on the Mac: /opt/homebrew/etc/dnsmasq.d/zeronetwork.conf
port=53
domain-needed
bogus-priv
no-resolv
no-hosts
server=8.8.8.8
server=1.1.1.1
local=/zeronetwork.test/
addn-hosts=/opt/homebrew/etc/dnsmasq.d/zeronetwork.hosts
local-ttl=30
log-queries
